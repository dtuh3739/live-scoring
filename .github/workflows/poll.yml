name: Poll scores

on:
  schedule:
    # Every 5 minutes during AU footy windows: Thu-Sun, 07:00-13:00 UTC
    # = 17:00-23:00 AEST (winter) / 18:00-00:00 AEDT (summer)
    # Cron days are 0-6 with 0=Sunday, so Thu-Sun = 4,5,6,0
    - cron: '*/5 7-13 * * 4,5,6,0'
  workflow_dispatch:  # allow manual runs from the Actions tab

permissions:
  contents: write  # needed to commit state file back

concurrency:
  group: poll
  cancel-in-progress: false  # let in-flight runs finish before next starts

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Poll scores
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_GAMES_CHANNEL: ${{ secrets.SLACK_GAMES_CHANNEL }}
        run: python poll.py

      - name: Commit state file
        run: |
          git config user.name  "score-agent[bot]"
          git config user.email "score-agent@users.noreply.github.com"
          git add state/
          if ! git diff --staged --quiet; then
            git commit -m "chore: update state [skip ci]"
            git pull --rebase origin master
            git push
          else
            echo "No state changes to commit."
          fi
